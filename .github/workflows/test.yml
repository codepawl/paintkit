name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get install -y ffmpeg
      - run: uv run --python 3.12 --with numpy --with scipy --with scikit-image --with pillow --with pytest python -m pytest -q
      - run: uv tool run --python 3.12 --from . paintkit --help
